<g class="a" style="animation-name:zt-hello-l3"><text x="24.0" y="130.8" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4b8fe3">docs</text><text x="74.4" y="130.8" textLength="75.6" lengthAdjust="spacingAndGlyphs">README.md</text><text x="166.8" y="130.8" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#2fcf7a">tool.py</text>
