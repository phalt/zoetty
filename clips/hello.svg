<svg xmlns="http://www.w3.org/2000/svg" width="552" height="175" viewBox="0 0 552 175" role="img" aria-label="Typing two commands in a terminal: echo prints a greeting, ls lists three files">
<title>Typing two commands in a terminal: echo prints a greeting, ls lists three files</title>
<style>
