@keyframes zt-hello-l0{0%{opacity:0}4.479%,100%{opacity:1}}
@keyframes zt-hello-t0-2{0%,6.159%{transform:translateX(0);animation-timing-function:steps(25,end)}16.125%,100%{transform:translateX(210.0px)}}
@keyframes zt-hello-k0{0%{opacity:0}4.479%{opacity:1}21.758%,100%{opacity:0}}
