<defs><clipPath id="zt-zen-screen"><rect x="0" y="52" width="653" height="210"/></clipPath></defs>
<rect width="653" height="280" rx="10" fill="#282c34"/>
<path d="M0 10a10 10 0 0 1 10-10h633a10 10 0 0 1 10 10v24h-653z" fill="#21252b"/><circle cx="18" cy="17.0" r="5.5" fill="#abb2bf" opacity=".3"/><circle cx="36" cy="17.0" r="5.5" fill="#abb2bf" opacity=".3"/><circle cx="54" cy="17.0" r="5.5" fill="#abb2bf" opacity=".3"/><text x="326.5" y="22.0" text-anchor="middle" opacity=".5" fill="#abb2bf" style="font-size:13px">python -m this</text>
<g clip-path="url(#zt-zen-screen)" fill="#abb2bf"><g class="a" style="animation-name:zt-zen-fade"><g class="a scroll" style="animation-name:zt-zen-scroll">
<g class="a" style="animation-name:zt-zen-l0"><text x="24.0" y="67.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" opacity=".55">$</text><text x="40.8" y="67.8" textLength="117.6" lengthAdjust="spacingAndGlyphs">python -m this</text>
<g class="a cover" style="animation-name:zt-zen-t0-2"><rect x="40.8" y="52.0" width="126.0" height="21" fill="#282c34"/></g>
</g>
<g class="a caret" style="animation-name:zt-zen-k0"><g class="a" style="animation-name:zt-zen-t0-2"><rect class="blink" x="40.8" y="54.0" width="8.4" height="17" fill="#abb2bf"/></g></g>
<g class="a" style="animation-name:zt-zen-l1"><text x="24.0" y="88.8" textLength="268.8" lengthAdjust="spacingAndGlyphs">The Zen of Python, by Tim Peters</text>
</g>
<g class="a" style="animation-name:zt-zen-l2">
</g>
<g class="a" style="animation-name:zt-zen-l3"><text x="24.0" y="130.8" textLength="252.0" lengthAdjust="spacingAndGlyphs">Beautiful is better than ugly.</text>
</g>
<g class="a" style="animation-name:zt-zen-l4"><text x="24.0" y="151.8" textLength="277.2" lengthAdjust="spacingAndGlyphs">Explicit is better than implicit.</text>
</g>
<g class="a" style="animation-name:zt-zen-l5"><text x="24.0" y="172.8" textLength="252.0" lengthAdjust="spacingAndGlyphs">Simple is better than complex.</text>
</g>
<g class="a" style="animation-name:zt-zen-l6"><text x="24.0" y="193.8" textLength="294.0" lengthAdjust="spacingAndGlyphs">Complex is better than complicated.</text>
</g>
<g class="a" style="animation-name:zt-zen-l7"><text x="24.0" y="214.8" textLength="226.8" lengthAdjust="spacingAndGlyphs">Flat is better than nested.</text>
</g>
<g class="a" style="animation-name:zt-zen-l8"><text x="24.0" y="235.8" textLength="235.2" lengthAdjust="spacingAndGlyphs">Sparse is better than dense.</text>
</g>
<g class="a" style="animation-name:zt-zen-l9"><text x="24.0" y="256.8" textLength="159.6" lengthAdjust="spacingAndGlyphs">Readability counts.</text>
</g>
<g class="a" style="animation-name:zt-zen-l10"><text x="24.0" y="277.8" textLength="462.0" lengthAdjust="spacingAndGlyphs">Special cases aren&#x27;t special enough to break the rules.</text>
</g>
<g class="a" style="animation-name:zt-zen-l11"><text x="24.0" y="298.8" textLength="294.0" lengthAdjust="spacingAndGlyphs">Although practicality beats purity.</text>
</g>
<g class="a" style="animation-name:zt-zen-l12"><text x="24.0" y="319.8" textLength="285.6" lengthAdjust="spacingAndGlyphs">Errors should never pass silently.</text>
</g>
<g class="a" style="animation-name:zt-zen-l13"><text x="24.0" y="340.8" textLength="226.8" lengthAdjust="spacingAndGlyphs">Unless explicitly silenced.</text>
</g>
<g class="a" style="animation-name:zt-zen-l14"><text x="24.0" y="361.8" textLength="478.8" lengthAdjust="spacingAndGlyphs">In the face of ambiguity, refuse the temptation to guess.</text>
</g>
<g class="a" style="animation-name:zt-zen-l15"><text x="24.0" y="382.8" textLength="579.6" lengthAdjust="spacingAndGlyphs">There should be one-- and preferably only one --obvious way to do it.</text>
</g>
<g class="a" style="animation-name:zt-zen-l16"><text x="24.0" y="403.8" textLength="554.4" lengthAdjust="spacingAndGlyphs">Although that way may not be obvious at first unless you&#x27;re Dutch.</text>
</g>
<g class="a" style="animation-name:zt-zen-l17"><text x="24.0" y="424.8" textLength="210.0" lengthAdjust="spacingAndGlyphs">Now is better than never.</text>
</g>
<g class="a" style="animation-name:zt-zen-l18"><text x="24.0" y="445.8" textLength="403.2" lengthAdjust="spacingAndGlyphs">Although never is often better than *right* now.</text>
</g>
<g class="a" style="animation-name:zt-zen-l19"><text x="24.0" y="466.8" textLength="487.2" lengthAdjust="spacingAndGlyphs">If the implementation is hard to explain, it&#x27;s a bad idea.</text>
</g>
<g class="a" style="animation-name:zt-zen-l20"><text x="24.0" y="487.8" textLength="537.6" lengthAdjust="spacingAndGlyphs">If the implementation is easy to explain, it may be a good idea.</text>
</g>
<g class="a" style="animation-name:zt-zen-l21"><text x="24.0" y="508.8" textLength="537.6" lengthAdjust="spacingAndGlyphs">Namespaces are one honking great idea -- let&#x27;s do more of those!</text>
</g>
<g class="a" style="animation-name:zt-zen-l22"><text x="24.0" y="529.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" opacity=".55">$</text>
</g>
<g class="a caret" style="animation-name:zt-zen-k22"><g><rect class="blink" x="40.8" y="516.0" width="8.4" height="17" fill="#abb2bf"/></g></g>
</g></g></g>
</svg>
