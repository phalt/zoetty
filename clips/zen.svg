@keyframes zt-zen-t0-2{0%,5.959%{transform:translateX(0);animation-timing-function:steps(14,end)}11.376%,100%{transform:translateX(117.6px)}}
@keyframes zt-zen-k0{0%{opacity:0}4.334%{opacity:1}16.793%,100%{opacity:0}}
@keyframes zt-zen-l1{0%{opacity:0}16.793%,100%{opacity:1}}
@keyframes zt-zen-l2{0%{opacity:0}18.743%,100%{opacity:1}}
@keyframes zt-zen-l3{0%{opacity:0}20.693%,100%{opacity:1}}
@keyframes zt-zen-l4{0%{opacity:0}22.644%,100%{opacity:1}}
@keyframes zt-zen-l5{0%{opacity:0}24.594%,100%{opacity:1}}
@keyframes zt-zen-l6{0%{opacity:0}26.544%,100%{opacity:1}}
@keyframes zt-zen-l7{0%{opacity:0}28.494%,100%{opacity:1}}
@keyframes zt-zen-l8{0%{opacity:0}30.444%,100%{opacity:1}}
@keyframes zt-zen-l9{0%{opacity:0}32.394%,100%{opacity:1}}
@keyframes zt-zen-l10{0%{opacity:0}34.345%,100%{opacity:1}}
@keyframes zt-zen-l11{0%{opacity:0}36.295%,100%{opacity:1}}
@keyframes zt-zen-l12{0%{opacity:0}38.245%,100%{opacity:1}}
@keyframes zt-zen-l13{0%{opacity:0}40.195%,100%{opacity:1}}
@keyframes zt-zen-l14{0%{opacity:0}42.145%,100%{opacity:1}}
@keyframes zt-zen-l15{0%{opacity:0}44.095%,100%{opacity:1}}
@keyframes zt-zen-l16{0%{opacity:0}46.046%,100%{opacity:1}}
@keyframes zt-zen-l17{0%{opacity:0}47.996%,100%{opacity:1}}
@keyframes zt-zen-l18{0%{opacity:0}49.946%,100%{opacity:1}}
@keyframes zt-zen-l19{0%{opacity:0}51.896%,100%{opacity:1}}
@keyframes zt-zen-l20{0%{opacity:0}53.846%,100%{opacity:1}}
@keyframes zt-zen-l21{0%{opacity:0}55.796%,100%{opacity:1}}
@keyframes zt-zen-l22{0%{opacity:0}67.497%,100%{opacity:1}}
@keyframes zt-zen-k22{0%{opacity:0}67.497%{opacity:1}100.000%,100%{opacity:0}}
@keyframes zt-zen-scroll{0%{transform:translateY(0)}34.345%{transform:translateY(-21px)}36.295%{transform:translateY(-42px)}38.245%{transform:translateY(-63px)}40.195%{transform:translateY(-84px)}42.145%{transform:translateY(-105px)}44.095%{transform:translateY(-126px)}46.046%{transform:translateY(-147px)}47.996%{transform:translateY(-168px)}49.946%{transform:translateY(-189px)}51.896%{transform:translateY(-210px)}53.846%{transform:translateY(-231px)}55.796%{transform:translateY(-252px)}67.497%{transform:translateY(-273px)}100%{transform:translateY(-273px)}}
@keyframes zt-zen-fade{0%{opacity:1}93.499%{opacity:1;animation-timing-function:ease}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.a,.blink{animation:none!important}.cover,.caret{display:none}.scroll{transform:translateY(-273px)}}
