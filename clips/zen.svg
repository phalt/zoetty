<svg xmlns="http://www.w3.org/2000/svg" width="653" height="280" viewBox="0 0 653 280" role="img" aria-label="python -m this printing the Zen of Python, scrolling past the bottom of a ten-row terminal">
<title>python -m this printing the Zen of Python, scrolling past the bottom of a ten-row terminal</title>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}
.a{animation-duration:9.23s;animation-iteration-count:infinite;animation-timing-function:step-end}
.blink{animation:zt-zen-blink 1s step-end infinite}
@keyframes zt-zen-blink{50%{opacity:0}}
