[project]
name = "zoetty"
version = "0.1.0"
description = "Looping terminal demo clips as plain SVG or HTML and CSS"
readme = "README.md"
authors = [{ name = "Paul Hallett", email = "paulandrewhallett@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
keywords = ["terminal", "svg", "demo", "animation", "cli", "docs", "readme"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/phalt/zoetty"
Documentation = "https://phalt.github.io/zoetty/"
Issues = "https://github.com/phalt/zoetty/issues"

[project.scripts]
zoetty = "zoetty.cli:cli"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "ipython>=9.17.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoetty"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# Import Linter: architectural contracts. Run with `make lint-imports`.
#
# If one breaks, change the import, not the contract.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "zoetty"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Module layers, from cli down to settings"
type = "layers"
layers = [
    "zoetty.cli",
    "zoetty.record | zoetty.svg | zoetty.html",
    "zoetty.timeline",
    "zoetty.clip",
    "zoetty.ansi | zoetty.markup",
    "zoetty.settings",
]
broken_contract_guidance = """
zoetty.cli wires everything together and is the only module that knows about the others.
The renderers only see timed lines from zoetty.timeline; recording only needs the clip.
Lower layers must not import higher ones, and modules in the same layer are independent:
anything two of them share belongs in a lower layer.
"""

[[tool.importlinter.contracts]]
id = "cli-owns-terminal"
name = "Only the CLI uses click and rich"
type = "forbidden"
source_modules = [
    "zoetty.record",
    "zoetty.svg",
    "zoetty.html",
    "zoetty.timeline",
    "zoetty.clip",
    "zoetty.ansi",
    "zoetty.markup",
    "zoetty.settings",
]
forbidden_modules = [
    "click",
    "rich",
]
broken_contract_guidance = """
zoetty owns the terminal through zoetty.cli. Other modules return values or raise errors,
and the CLI shows them.
"""

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles"
type = "acyclic_siblings"
ancestors = ["zoetty"]
